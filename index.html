<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b1c">
  <meta name="description" content="PBB Cameras 24/7 — independent fan viewing dashboard.">
  <title>PBB Cameras 24/7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b1c;
      --surface: #11142b;
      --surface-2: #171a38;
      --surface-3: #1d2145;
      --line: rgba(166, 157, 255, .16);
      --text: #f6f5ff;
      --muted: #9297bd;
      --purple: #a78bfa;
      --purple-2: #7c3aed;
      --blue: #55c7ff;
      --cyan: #83e5ff;
      --pink: #ed8bff;
      --green: #5ce0b1;
      --shadow: 0 24px 70px rgba(0,0,0,.36);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(ellipse at 12% -10%, rgba(124,58,237,.22), transparent 38rem),
        radial-gradient(ellipse at 92% 8%, rgba(14,165,233,.16), transparent 34rem),
        var(--bg);
    }
    button { font: inherit; }

    .topbar {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      padding: 16px clamp(18px, 4vw, 58px);
      border-bottom: 1px solid var(--line);
      background: rgba(9,11,28,.76);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .brand-mark {
      width: 43px; height: 43px; flex: 0 0 auto;
      display: grid; place-items: center;
      border-radius: 14px;
      color: white;
      font-size: 21px;
      background: linear-gradient(145deg, #a78bfa, #596bfa 58%, #38bdf8);
      box-shadow: 0 8px 28px rgba(99,102,241,.32);
    }
    .brand-name {
      font: 700 17px/1.1 "Space Grotesk", sans-serif;
      letter-spacing: .055em;
      white-space: nowrap;
    }
    .brand-name span {
      background: linear-gradient(90deg, #c4b5fd, #67d5ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .brand-tag {
      margin-top: 5px; color: var(--muted);
      font-size: 9px; font-weight: 700; letter-spacing: .22em;
    }
    .topbar-right { display: flex; align-items: center; gap: 20px; }
    .live-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 12px; border: 1px solid rgba(255,91,133,.24);
      border-radius: 999px; color: #ff8eae;
      background: rgba(255,75,125,.08);
      font-size: 10px; font-weight: 800; letter-spacing: .12em;
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #ff557f; box-shadow: 0 0 12px #ff557f;
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse { 50% { opacity: .45; box-shadow: 0 0 3px #ff557f; } }
    #clock { color: #aeb8e8; font-size: 11px; font-weight: 600; white-space: nowrap; }

    .shell {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 34px clamp(14px, 3.6vw, 54px) 26px;
    }
    .intro {
      display: flex; justify-content: space-between; align-items: end;
      gap: 20px; margin-bottom: 25px;
    }
    .eyebrow {
      display: flex; align-items: center; gap: 9px;
      color: var(--blue); font-size: 10px; font-weight: 800;
      letter-spacing: .2em; text-transform: uppercase;
      margin-bottom: 10px;
    }
    .eyebrow::before {
      content: ""; width: 22px; height: 1px;
      background: linear-gradient(90deg, var(--purple), var(--blue));
    }
    h1 {
      margin: 0; font: 700 clamp(25px, 3vw, 36px)/1.08 "Space Grotesk", sans-serif;
      letter-spacing: -.04em;
    }
    .intro-copy { margin: 9px 0 0; color: var(--muted); font-size: 13px; }
    .channel-count {
      flex: 0 0 auto; padding: 10px 14px; border: 1px solid var(--line);
      border-radius: 12px; background: rgba(23,26,56,.7);
      color: #c8c5f8; font-size: 11px; font-weight: 700;
    }
    .channel-count strong { color: var(--blue); font-size: 15px; margin-right: 5px; }

    .dashboard {
      display: grid; grid-template-columns: 230px minmax(0,1fr) 315px;
      gap: 19px; align-items: start;
    }
    .sidebar, .player-card, .detail-card {
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(21,24,53,.96), rgba(14,17,39,.96));
      box-shadow: var(--shadow);
    }
    .sidebar { border-radius: 18px; padding: 17px 12px; }
    .side-heading {
      display: flex; align-items: center; justify-content: space-between;
      padding: 3px 9px 14px;
      color: #a9a6dc; font-size: 9px; font-weight: 800;
      letter-spacing: .18em; text-transform: uppercase;
    }
    .side-heading span:last-child {
      color: #6e759e; font-size: 9px; letter-spacing: .04em;
    }
    .camera-list { display: grid; gap: 7px; }
    .camera-btn {
      position: relative; width: 100%; min-height: 68px;
      display: flex; align-items: center; gap: 12px;
      padding: 11px 12px; border: 1px solid transparent;
      border-radius: 12px; color: #c5c7e4; text-align: left;
      background: transparent; cursor: pointer; transition: .2s ease;
    }
    .camera-btn:hover { background: rgba(130,120,220,.09); border-color: var(--line); }
    .camera-btn.active {
      color: white;
      border-color: rgba(135,145,255,.38);
      background: linear-gradient(105deg, rgba(124,58,237,.28), rgba(14,165,233,.15));
      box-shadow: inset 3px 0 0 #9b83ff, 0 8px 24px rgba(60,75,180,.12);
    }
    .cam-icon {
      width: 39px; height: 39px; flex: 0 0 auto;
      display: grid; place-items: center; border-radius: 11px;
      background: #202348; font-size: 18px;
    }
    .camera-btn.active .cam-icon { background: linear-gradient(145deg, #6943c7, #286cb4); }
    .cam-copy { min-width: 0; flex: 1; }
    .cam-name { display: block; font-size: 10px; font-weight: 800; letter-spacing: .055em; }
    .cam-status { display: flex; align-items: center; gap: 6px; margin-top: 6px; color: #858bad; font-size: 9px; }
    .mini-dot { width: 5px; height: 5px; border-radius: 50%; background: #68708f; }
    .camera-btn:first-child .mini-dot { background: var(--green); box-shadow: 0 0 8px rgba(92,224,177,.6); }
    .chevron { color: #737ba6; font-size: 17px; }

    .main { min-width: 0; }
    .player-card { overflow: hidden; border-radius: 18px; }
    .player-top {
      min-height: 75px; display: flex; justify-content: space-between;
      align-items: center; gap: 14px; padding: 17px 20px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(105deg, rgba(124,58,237,.13), rgba(14,165,233,.09));
    }
    .player-heading { min-width: 0; }
    .player-title { font: 700 14px "Space Grotesk", sans-serif; letter-spacing: .015em; }
    .player-subtitle { margin-top: 5px; color: #8e95bd; font-size: 10px; }
    .source-tag {
      flex: 0 0 auto; padding: 7px 10px; border: 1px solid rgba(85,199,255,.2);
      border-radius: 7px; color: #8edcff; background: rgba(14,165,233,.08);
      font-size: 9px; font-weight: 800; letter-spacing: .1em;
    }
    .video-screen {
      width: 100%; aspect-ratio: 16/9; min-height: 220px;
      display: grid; place-items: center; overflow: hidden;
      background:
        radial-gradient(ellipse at center, rgba(44,55,111,.23), transparent 58%),
        #050714;
    }
    .video-screen iframe { display: block; width: 100%; height: 100%; border: 0; }
    .offline { max-width: 340px; padding: 30px 20px; text-align: center; }
    .offline-icon {
      width: 66px; height: 66px; display: grid; place-items: center;
      margin: 0 auto 16px; border: 1px solid rgba(167,139,250,.24);
      border-radius: 20px; color: #bba8ff; font-size: 27px;
      background: linear-gradient(145deg, rgba(124,58,237,.2), rgba(14,165,233,.12));
    }
    .offline h3 { margin: 0; font: 700 15px "Space Grotesk", sans-serif; }
    .offline p { margin: 9px 0 0; color: #8990b5; font-size: 11px; line-height: 1.7; }
    .player-bottom {
      min-height: 58px; display: flex; justify-content: space-between;
      align-items: center; gap: 12px; padding: 12px 18px;
      border-top: 1px solid var(--line); color: #9299bd; font-size: 10px;
    }
    .broadcast-name { display: flex; align-items: center; gap: 8px; }
    .broadcast-name span { color: #6fd7ff; font-size: 13px; }
    .fullscreen-btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 12px; border: 1px solid rgba(151,139,255,.35);
      border-radius: 8px; color: #e6e2ff; background: rgba(124,58,237,.15);
      font-size: 9px; font-weight: 800; letter-spacing: .08em;
      cursor: pointer; transition: .2s;
    }
    .fullscreen-btn:hover { background: rgba(124,58,237,.3); border-color: #9b83ff; }

    .detail-card {
      display: grid; grid-template-columns: 1fr auto; align-items: center;
      gap: 18px; margin-top: 15px; padding: 17px 19px;
      border-radius: 15px; box-shadow: none;
    }
    .detail-label {
      color: #9d91e8; font-size: 9px; font-weight: 800;
      letter-spacing: .16em; text-transform: uppercase;
    }
    .detail-card h2 { margin: 7px 0 5px; font: 700 13px "Space Grotesk", sans-serif; }
    .detail-card p { max-width: 680px; margin: 0; color: #9299bd; font-size: 11px; line-height: 1.65; }
    .detail-mark {
      width: 43px; height: 43px; display: grid; place-items: center;
      border-radius: 13px; color: #9bdfff; font-size: 19px;
      background: linear-gradient(145deg, rgba(124,58,237,.22), rgba(14,165,233,.18));
      border: 1px solid var(--line);
    }
    footer {
      padding: 25px 10px 6px; color: #687093; text-align: center;
      font-size: 9px; line-height: 1.8; letter-spacing: .025em;
    }
    footer strong { color: #9298bd; font-weight: 700; }


    /* VIEWER CHAT */
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .chat-card {
      min-width:0; min-height:620px; height:100%;
      display:flex; flex-direction:column; overflow:hidden;
      border:1px solid rgba(166,157,255,.2); border-radius:18px;
      background:linear-gradient(155deg,rgba(27,25,64,.98),rgba(12,19,44,.98));
      box-shadow:0 24px 70px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.035);
    }
    .chat-header {
      min-height:75px; padding:15px 16px; display:flex; align-items:center;
      justify-content:space-between; gap:9px; border-bottom:1px solid var(--line);
      background:linear-gradient(105deg,rgba(124,58,237,.2),rgba(14,165,233,.13));
    }
    .chat-heading { display:flex; align-items:center; gap:10px; min-width:0; }
    .chat-orb {
      width:38px;height:38px;display:grid;place-items:center;flex:0 0 auto;
      border-radius:12px;color:#fff;font-size:18px;
      background:linear-gradient(145deg,#9b70f4,#3b8fe0);
      box-shadow:0 7px 22px rgba(112,91,230,.28);
    }
    .chat-title { font:700 12px "Space Grotesk",sans-serif; letter-spacing:.1em; }
    .chat-subtitle { margin-top:5px;color:#969bc3;font-size:8px;letter-spacing:.15em; }
    .chat-live { display:flex;align-items:center;gap:6px;white-space:nowrap;color:#8fe3ff;font-size:8px;font-weight:800;letter-spacing:.08em; }
    .chat-live i,.online-pulse { width:6px;height:6px;border-radius:50%;background:#5ce0b1;box-shadow:0 0 9px #5ce0b1; }
    .chat-welcome { padding:23px 17px 18px; }
    .welcome-kicker { color:#8edcff;font-size:8px;font-weight:800;letter-spacing:.17em; }
    .chat-welcome h2 { margin:9px 0 6px;font:700 19px "Space Grotesk",sans-serif;letter-spacing:-.035em; }
    .chat-welcome p { margin:0 0 17px;color:#9299bd;font-size:10px;line-height:1.6; }
    .username-form { display:grid;gap:8px; }
    .username-form input,.chat-compose input {
      width:100%;min-width:0;outline:none;color:#f6f5ff;
      border:1px solid rgba(166,157,255,.22);border-radius:9px;
      background:rgba(7,10,27,.7);transition:border-color .2s,box-shadow .2s;
    }
    .username-form input { padding:12px 11px;font-size:11px; }
    .username-form input:focus,.chat-compose input:focus { border-color:#7c9dff;box-shadow:0 0 0 3px rgba(99,102,241,.13); }
    .username-form input::placeholder,.chat-compose input::placeholder { color:#72799f; }
    .username-form button {
      display:flex;justify-content:center;align-items:center;gap:10px;
      padding:11px;border:1px solid rgba(173,157,255,.38);border-radius:9px;
      color:#fff;background:linear-gradient(100deg,#7845d4,#247fc0);
      font-size:9px;font-weight:800;letter-spacing:.12em;cursor:pointer;
      box-shadow:0 7px 20px rgba(75,91,199,.2);
    }
    .username-form button:hover { filter:brightness(1.13); }
    .chat-note { margin-top:10px;color:#70789f;font-size:8px;line-height:1.5; }
    .chat-room { min-height:0;flex:1;display:flex;flex-direction:column; }
    .chat-room-bar {
      min-height:43px;padding:0 13px;display:flex;align-items:center;
      justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);
      color:#b9bee0;font-size:8px;letter-spacing:.08em;
    }
    .chat-room-bar > div { display:flex;align-items:center;gap:8px; }
    .change-user { border:0;background:none;color:#8fcfff;font-size:8px;font-weight:800;cursor:pointer; }
    .chat-messages {
      flex:1;min-height:190px;max-height:430px;overflow-y:auto;
      display:flex;flex-direction:column;gap:10px;padding:14px 12px;
      scrollbar-width:thin;scrollbar-color:#514b8c transparent;
    }
    .chat-empty { margin:auto;display:flex;flex-direction:column;align-items:center;gap:7px;color:#8289ae;text-align:center; }
    .chat-empty span { color:#a994ff;font-size:25px; }
    .chat-empty strong { color:#c6c7e4;font:600 11px "Space Grotesk",sans-serif; }
    .chat-empty small { font-size:9px; }
    .message { max-width:94%;align-self:flex-start; }
    .message.mine { align-self:flex-end; }
    .message-meta { display:flex;align-items:center;gap:7px;margin:0 4px 5px;color:#8d94b8;font-size:8px; }
    .message.mine .message-meta { justify-content:flex-end; }
    .message-user { color:#bdaaff;font-weight:800; }
    .message.mine .message-user { color:#83d9ff; }
    .message-bubble {
      padding:9px 11px;border:1px solid rgba(160,151,255,.13);
      border-radius:4px 12px 12px 12px;
      color:#e9eaff;background:linear-gradient(130deg,rgba(107,72,180,.28),rgba(46,81,145,.25));
      font-size:10px;line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap;
    }
    .message.mine .message-bubble {
      border-color:rgba(86,186,255,.2);border-radius:12px 4px 12px 12px;
      background:linear-gradient(130deg,rgba(41,111,170,.32),rgba(94,66,171,.3));
    }
    .chat-compose-wrap { padding:11px 11px 12px;border-top:1px solid var(--line);background:rgba(7,10,27,.34); }
    .chat-compose { display:flex;align-items:center;gap:7px; }
    .chat-compose input { padding:11px 10px;font-size:10px; }
    .chat-compose button {
      width:37px;height:37px;flex:0 0 auto;border:0;border-radius:10px;
      color:white;background:linear-gradient(145deg,#9866ec,#278bd0);
      font-size:16px;cursor:pointer;box-shadow:0 5px 15px rgba(77,94,205,.25);
    }
    .chat-compose button:disabled { opacity:.45;cursor:not-allowed; }
